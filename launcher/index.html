<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Hunters TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Luckiest+Guy&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #1a1030; color: #fff1d6; font-family: 'Fredoka', system-ui, sans-serif; overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(circle at 50% 40%, #3a2470 0%, #1a1030 70%); }
  .logo { font-family: 'Luckiest Guy', Impact, sans-serif; text-align: center; line-height: .9; }
  .logo .a { font-size: 96px; -webkit-text-stroke: 7px #1a1030; paint-order: stroke fill; text-shadow: 0 6px 0 #0a0618; }
  .logo .b { font-size: 70px; color: #7dff5a; -webkit-text-stroke: 6px #1a1030; paint-order: stroke fill; text-shadow: 0 6px 0 #0a0618; }
  .logo .tv { display: inline-block; font-size: 44px; color: #fff; background: #ff4a5a; border: 5px solid #1a1030; border-radius: 14px; padding: 4px 14px 0; transform: rotate(4deg); margin-left: 10px; vertical-align: 14px; }
  .ghost { width: 110px; height: 110px; animation: float 2.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-14px) rotate(4deg); } }
  .status { font-size: 20px; letter-spacing: .12em; min-height: 26px; }
  .bar { width: min(420px, 70vw); height: 16px; border: 4px solid #0a0618; border-radius: 10px; background: #2a1a4a; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #7dff5a; transition: width .2s; }
  .bar.idle i { width: 30%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
  .ver { position: fixed; bottom: 14px; font-size: 13px; opacity: .55; }
</style>
</head>
<body>
  <svg class="ghost" viewBox="0 0 100 100"><path d="M18 48 C18 22 82 22 82 48 L82 86 C76 80 72 92 66 86 C60 80 56 92 50 86 C44 80 40 92 34 86 C28 80 24 92 18 86 Z" fill="#fffaf0" stroke="#1a1030" stroke-width="5"/><ellipse cx="39" cy="50" rx="6" ry="8" fill="#1a1030"/><ellipse cx="61" cy="50" rx="6" ry="8" fill="#1a1030"/><ellipse cx="50" cy="66" rx="6" ry="5" fill="#1a1030"/></svg>
  <div class="logo"><div class="a">GHOST</div><div class="b">HUNTERS<span class="tv">TV</span></div></div>
  <div class="status" id="s">STARTING UP</div>
  <div class="bar idle" id="b"><i></i></div>
  <div class="ver" id="v">Ruff Dogs Studios</div>
<script>
// Talks to GhostHuntersTV.exe: it reports update progress, and as soon as the
// game files are ready we ask it to start the game. No clicks needed.
const host = window.chrome && window.chrome.webview, s = document.getElementById('s'), b = document.getElementById('b'), v = document.getElementById('v');
let started = false;
function go() { if (started) return; started = true; s.textContent = 'LOADING THE SHOW'; setTimeout(() => host ? host.postMessage('play') : (location.href = '../index.html'), 700); }
function onUpdate(m) {
  if (m.version) v.textContent = `version ${m.version}${m.remote > m.version ? ' → ' + m.remote : ''} · Ruff Dogs Studios`;
  if (m.phase === 'checking') { s.textContent = 'CHECKING FOR UPDATES'; b.className = 'bar idle'; return; }
  if (m.phase === 'downloading') { s.textContent = `DOWNLOADING UPDATE · ${m.pct}%`; b.className = 'bar'; b.firstElementChild.style.width = m.pct + '%'; return; }
  b.className = 'bar'; b.firstElementChild.style.width = '100%';
  s.textContent = m.phase === 'ready' ? 'UPDATED!' : m.phase === 'current' ? 'UP TO DATE' : m.phase === 'offline' ? 'OFFLINE · PLAYING THE VERSION YOU HAVE' : 'UPDATE FAILED · PLAYING THE VERSION YOU HAVE';
  go();
}
if (host) { host.addEventListener('message', e => { const m = e.data; if (m && m.t === 'update') onUpdate(m); }); host.postMessage('hello'); setTimeout(go, 20000); }
else setTimeout(go, 600);
</script>
</body>
</html>
